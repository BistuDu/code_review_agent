[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "Readable, snapshot-based code review with AgentScope"
requires-python = ">=3.11"
dependencies = ["agentscope==2.0.7.post1", "datasets>=3,<6", "wcmatch>=10,<11", "jsonschema>=4,<5", "numpy<2.5", "filelock>=4,<5", "openai>=3,<4", "httpx>=0.28,<1", "jinja2>=3,<4", "pydantic>=2,<3", "huggingface-hub>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-jsonschema"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_review_agent = ["resources/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = ".cache/ruff"
extend-exclude = ["build", ".venv", ".cache", ".state", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# 缓存/临时路径必须在模型和数据集库导入前初始化。
[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"session.py" = ["E402"]
"benchmark.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/code_review_agent"]
mypy_path = "src"
strict = true
cache_dir = ".cache/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
addopts = "-ra --basetemp=.cache/test-tmp"
